# Jekyll Configuration for the OSI Hackathon Website

# Site settings
title: "Open Scientific Intelligence (OSI) Hackathon for Materials Science & Chemistry"
description: "A hybrid international hackathon connecting researchers from across the globe to build open scientific intelligence — LLMs, agents, datasets, models, and software — for the biggest problems in materials science and chemistry."
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://llmhackathon.github.io" # the base hostname & protocol for your site

# Author information
author:
  name: "OSI Hackathon Organizers"
  email: "blaiszik@uchicago.edu"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty
sass:
  sass_dir: _sass
  style: compressed

# Plugins
plugins:
  - jekyll-sass-converter

# Collections
collections:
  sites:
    output: true
    permalink: /sites/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "sites"
    values:
      layout: "site-location"

# Exclude files from processing
exclude:
  - README.md
  - CLAUDE.md
  - PRODUCT.md
  - DESIGN.md
  - DEPLOYMENT.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - backup
  - "*.backup"

# Include files
include:
  - _pages

# Event information
event:
  dates: "September 11-12, 2025"
  kickoff: "9:00 AM (CT), Sept 11"
  submission_deadline: "5:00 PM (CT), Sept 12"
  countdown_date: "September 11, 2025 12:00:00"
  # Next edition teaser (dates not yet set)
  next_edition: "October 2026"
  next_edition_status: "dates TBA"

# External links
links:
  registration: "https://lu.ma/hspoki8y"
  slack: "https://join.slack.com/t/llmsformateri-0lw8517/shared_invite/zt-3df7bc0z5-I6odHw8eHaBbtHqsGxqz0Q"
  main_organizer_email: "blaiszik@uchicago.edu"

# SEO settings
google_analytics: # Add if needed
lang: en_US
