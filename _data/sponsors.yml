# Sponsor/Partner information, split by edition.
# Kept as separate per-year lists (rather than a "returning" flag) since a
# name can drop off or a new sponsor can be added without touching the
# record of a past edition. Order is display order.

# 2026 — the Open Scientific Intelligence Hackathon, presented by the
# Materials Discovery Research Institute (the first entry, also named in the
# homepage hero).
sponsors_2026:
  - name: "Materials Discovery Research Institute"
    logo: "/assets/images/sponsors/MDRI_logo.png"
    alt: "UL Research Institutes Materials Discovery Research Institute logo"
    url: "https://materialsdiscovery.ul.org"
    blurb: "UL Research Institutes' center for AI-driven, high-throughput discovery of materials for energy, decarbonization, and water."
  - name: "UL Research Institutes"
    logo: "/assets/images/sponsors/ULRI_logo.svg"
    alt: "UL Research Institutes logo"
    url: "https://ul.org"
    tall: true  # stacked/square mark — gets extra height in the homepage band
    blurb: "Nonprofit safety science organization advancing research for a safer, more secure, and sustainable world."
  - name: "Valency"
    logo: "/assets/images/sponsors/Valency_logo.svg"
    alt: "Valency logo"
    url: "https://www.valency.io"
    blurb: "AI-accelerated research platform that connects AI assistants to the current scientific literature."
  - name: "NVIDIA"
    logo: "/assets/images/sponsors/NVIDIA_logo.svg"
    alt: "NVIDIA logo"
    url: "https://www.nvidia.com"
    blurb: "Accelerated computing and AI platforms powering scientific discovery."
  - name: "Hugging Face"
    logo: "/assets/images/sponsors/HF_Logo.svg"
    alt: "Hugging Face logo"
    url: "https://huggingface.co"
    blurb: "The leading open platform for machine learning models, datasets, and demos."
  - name: "Labric"
    logo: "/assets/images/sponsors/Labric_logo.svg"
    alt: "Labric logo"
    url: "https://www.labric.co"
    blurb: "Data infrastructure for research scientists — capturing instrument data and making it ready for AI-powered analysis."
  - name: "Adaption"
    logo: "/assets/images/sponsors/Adaption_logo.svg"
    alt: "Adaption logo"
    url: "https://adaptionlabs.ai"
    blurb: "Building adaptive intelligence: efficient AI systems that continually learn."
  - name: "Green Dynamics"
    logo: "/assets/images/sponsors/greendynamics.png"
    alt: "Green Dynamics logo"
    url: "https://www.greendynamics.com.au"
    light: true  # pale artwork — darkened in the homepage band so it reads on white
    blurb: "Generative AI for new materials discovery, and makers of the open-source scientific LLM DARWIN."
  - name: "National Science Foundation"
    logo: "/assets/images/sponsors/NSF_logo.webp"
    alt: "NSF logo"
    url: "https://www.nsf.gov"
    tall: true  # stacked/square mark — gets extra height in the homepage band
    blurb: "Independent federal agency supporting science and engineering in all 50 states and U.S. territories."
  - name: "NIST"
    logo: "/assets/images/sponsors/NIST_logo.svg"
    alt: "National Institute of Standards and Technology (NIST) logo"
    url: "https://www.nist.gov"
    blurb: "National Institute of Standards and Technology — advancing measurement science, standards, and technology."
  - name: "Globus"
    logo: "/assets/images/sponsors/Globus_logo.svg"
    alt: "Globus logo"
    url: "https://www.globus.org"
    tall: true  # mark only, no wordmark
    blurb: "Research data management — secure, reliable file transfer, sharing, and automation for science."

